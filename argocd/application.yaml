apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: map-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kaljo14/map-infra.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: lonctus
  syncPolicy:
    automated:
      prune: true # removes resources deleted from git
      selfHeal: true # reverts manual kubectl changes
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
