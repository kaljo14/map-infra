name: Build PostgreSQL backup image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Test a disposable backup and PostGIS restore before publishing
        run: |
          docker build -t map-infra-backup:test backup
          docker build -t map-infra-restore:test -f backup/restore.Dockerfile backup
          bash backup/integration.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMD64 and ARM64 clients
        uses: docker/build-push-action@v6
        id: image
        with:
          context: backup
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/map-infra-postgres-backup:sha-${{ github.sha }}
      - name: Record image for the CronJob
        env:
          BACKUP_IMAGE: ghcr.io/${{ github.repository_owner }}/map-infra-postgres-backup:sha-${{ github.sha }}@${{ steps.image.outputs.digest }}
        run: echo "$BACKUP_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish disposable PostGIS recovery server
        uses: docker/build-push-action@v6
        id: restore
        with:
          context: backup
          file: backup/restore.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/map-infra-postgres-restore:sha-${{ github.sha }}
      - name: Record recovery server image
        env:
          RESTORE_IMAGE: ghcr.io/${{ github.repository_owner }}/map-infra-postgres-restore:sha-${{ github.sha }}@${{ steps.restore.outputs.digest }}
        run: echo "$RESTORE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
