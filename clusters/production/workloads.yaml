apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./infrastructure/namespaces
  prune: false
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: map-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: tile-storage
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./apps
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/monitoring
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tile-generator
  namespace: flux-system
spec:
  # Retained as an empty cleanup bundle to prune the old Job and its Pods.
  # Deleting this Kustomization with deletionPolicy: Orphan would leave them behind.
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./apps/tileserver/generator
  prune: true
  deletionPolicy: Orphan
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tile-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./apps/tileserver/storage
  prune: false
  deletionPolicy: Orphan
  # K3s local-path volumes bind only after a consumer Pod is scheduled.
  # The tileserver is scaled to zero, so no active consumer may bind this PVC.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
