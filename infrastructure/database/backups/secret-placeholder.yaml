# Example ONLY; excluded from Kustomize. Store the real file outside this repo.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-storage
  namespace: database
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:https://ACCOUNT_ID.r2.cloudflarestorage.com/BUCKET/postgres
  RESTIC_PASSWORD: REPLACE_WITH_LONG_RANDOM_PASSWORD_AND_SAVE_OFFSITE
  AWS_ACCESS_KEY_ID: REPLACE_WITH_BUCKET_SCOPED_ACCESS_KEY
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_BUCKET_SCOPED_SECRET_KEY
