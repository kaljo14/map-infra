apiVersion: v1
kind: Secret
metadata:
  name: places-scraper-secret
  namespace: lonctus
type: Opaque
stringData:
  POSTGRES_USER: "geopulse"
  POSTGRES_PASSWORD: "<CHANGE_ME>"
  POSTGRES_DB: "geopulse"
  POSTGRES_CONN_STRING: "postgres://geopulse:<CHANGE_ME>@<POSTGRES_SERVICE>:5432/geopulse?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: scraper-gg-secret
  namespace: lonctus
type: Opaque
stringData:
  GOOGLE_PLACES_API_KEY: "<CHANGE_ME>"
