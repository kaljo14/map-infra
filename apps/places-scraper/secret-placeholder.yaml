  kubectl create secret generic places-scraper-secret -n lonctus \
    --from-literal=POSTGRES_USER='geopulse' \
    --from-literal=POSTGRES_PASSWORD='geopulse' \
    --from-literal=POSTGRES_DB='geopulse' \
    --from-literal=POSTGRES_CONN_STRING='postgres://geopulse:<CHANGE_ME>@<POSTGRES_SERVICE>:5432/geopulse?sslmode=disable'
