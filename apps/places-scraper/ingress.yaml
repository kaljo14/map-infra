apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scraper-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - places-scraper.lonctus.com
    secretName: scraper-tls
  rules:
  - host: places-scraper.lonctus.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: places-scraper
            port:
              number: 80
