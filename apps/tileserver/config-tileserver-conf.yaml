apiVersion: v1
kind: ConfigMap
metadata:
  name: tileserver-config
  labels:
    app: tileserver
data:
  config.json: |
    {
      "options": {
        "serveStaticMaps": true
      },
      "data": {
        "grid": {
          "mbtiles": "/data/grid.mbtiles"
        },
        "density": {
          "mbtiles": "/data/density.mbtiles"
        },
      }
    }

