apiVersion: batch/v1
kind: Job
metadata:
  name: grid-tile-generator
  namespace: lonctus
  annotations:
    # Recreate this Job when an image update changes its immutable pod template.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  template:
    spec:
      containers:
      - name: generator
        image: kaljo14/grid-tile-generator:latest@sha256:738686dfd9a5d0b49bbed4f1d30b45f01dca0b6cf8e27bf887115879730b3a9b
        volumeMounts:
        - name: tiles
          mountPath: /data
      restartPolicy: Never
      volumes:
      - name: tiles
        persistentVolumeClaim:
          claimName: tiles-pvc
  backoffLimit: 2
