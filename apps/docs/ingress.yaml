apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  namespace: lonctus
spec:
  ingressClassName: traefik
  rules:
    - host: docs.lonctus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  number: 80
