apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lonctus
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kaljo14/my-map@sha256:f4a5e08d018d2cbfc287ed46ab678ae931c648195da0aa2195a87797c8fa12ff
          env:
            - name: ENABLE_AUTH
              value: "true"
            - name: PLACES_API_URL
              value: "http://places-scraper"
            - name: TILES_API_URL
              value: "http://tileserver"
            - name: MARTIN_API_URL
              value: "http://martin"
          ports:
            - name: http
              containerPort: 80 # Adjust if your app listens on 3000 or 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lonctus
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80 # Must match containerPort
      protocol: TCP
      name: http
  selector:
    app: frontend
