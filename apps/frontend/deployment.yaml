apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kaljo14/my-map@sha256:798c837ab5e181a78b4f83995d27c355ece402ee1708faafdc9eacc0e9e9ac02
          env:
            - name: ENABLE_AUTH
              value: "true"
            - name: PLACES_API_URL
              value: "https://places-scraper.mustaci.com/"
            - name: TILES_API_URL
              value: "https://tiles.mustaci.com/"
            - name: KEYCLOAK_URL
              value: "https://keycloak.mustaci.com"
          ports:
            - name: http
              containerPort: 80 # Adjust if your app listens on 3000 or 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: map
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80 # Must match containerPort
      protocol: TCP
      name: http
  selector:
    app: frontend
