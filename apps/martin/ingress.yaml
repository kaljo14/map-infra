apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: martin-ingress
  namespace: map
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - martin.mustaci.com
    secretName: martin-tls
  rules:
  - host: martin.mustaci.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: martin
            port:
              number: 80
