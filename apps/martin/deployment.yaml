apiVersion: apps/v1
kind: Deployment
metadata:
  name: martin
  namespace: lonctus
  labels:
    app: martin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: martin
  template:
    metadata:
      labels:
        app: martin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: "/stats/prometheus"
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.29-latest
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

      - name: martin
        image: ghcr.io/maplibre/martin:latest
        args: ["--auto-bounds=calc"]
        ports:
        - name: app-port
          containerPort: 3000
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: places-scraper-secret
              key: POSTGRES_CONN_STRING
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

      volumes:
      - name: envoy-config
        configMap:
          name: martin-envoy-config
          items:
          - key: envoy.yaml
            path: envoy.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: martin
  labels:
    app: martin
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: martin
