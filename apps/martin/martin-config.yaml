apiVersion: v1
kind: ConfigMap
metadata:
  name: martin-config
  namespace: lonctus
data:
  martin-config.yaml: |
    # Martin tile sources derived from the live catalog.
    # Tile endpoint pattern: https://martin.lonctus.com/{table}/{z}/{x}/{y}

    tables:
      places:
        schema: public
        geometry_column: location
        minzoom: 0
        maxzoom: 22
        id_column: id

      gtfs_stops:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      gtfs_route_shapes:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      metro_line_M1:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      metro_line_M2:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      metro_line_M3:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      metro_line_M4:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      population_grid:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      barbershop_density:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      opportunity_heatmap:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      # Accessibility & Transport tile views (SofiaPlan datasets 96, 279, 289, 282, 268, 333, 223, 472, 254, 602)
      sofiaplan_transit_access_ge_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_transit_access_district_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_metro_access_800m_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_metro_access_1200m_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_bus_lines_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_bus_lines_alt_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_trolleybus_lines_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_tram_lines_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_tram_lines_alt_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_railway_stations_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      parking_zones_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      # Health service datasets (SofiaPlan datasets 597, 598)
      sofiaplan_health_service_concentration_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      sofiaplan_health_infrastructure_concentration_tiles:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id
