      sofiaplan_residential_typology_ge_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_urban_morphology_ge_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

    # =========================================================
    # Pedestrian network
    # =========================================================
      sofiaplan_pedestrian_syntax_tiles:
        schema: public
        geometry_column: geom
        minzoom: 10
        maxzoom: 22
        id_column: id

      sofiaplan_pedestrian_city_tiles:
        schema: public
        geometry_column: geom
        minzoom: 10
        maxzoom: 22
        id_column: id

      sofiaplan_pedestrian_city_alt_tiles:
        schema: public
        geometry_column: geom
        minzoom: 10
        maxzoom: 22
        id_column: id

      sofiaplan_pedestrian_municipality_tiles:
