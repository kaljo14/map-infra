      sofiaplan_bus_lines_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_bus_lines_alt_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_trolleybus_lines_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_tram_lines_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_tram_lines_alt_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_railway_stations_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

    # =========================================================
    # Cycling network
    # =========================================================
      sofiaplan_cycling_network_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_cycling_network_alt_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_cycling_planned_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

    # =========================================================
    # Parking zones
    # =========================================================
      parking_zones_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
