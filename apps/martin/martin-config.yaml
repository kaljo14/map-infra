apiVersion: v1
kind: ConfigMap
metadata:
  name: martin-config
  namespace: lonctus
data:
  martin-config.yaml: |
    # Martin tile server configuration — all layers for lonctus.com
    # Tile endpoint: /api/martin/{source}/{z}/{x}/{y}

    # =========================================================
    # Core data tables
    # =========================================================
    tables:
      places:
        schema: public
        geometry_column: location
        minzoom: 0
        maxzoom: 22
        id_column: id

      gtfs_stops:
        schema: public
        geometry_column: geom
        minzoom: 0
        maxzoom: 22
        id_column: id

      gtfs_route_shapes:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      osm_pois:
        schema: public
        geometry_column: geom
        minzoom: 10
        maxzoom: 22
        id_column: id

      osm_nodes:
        schema: public
        geometry_column: geom
        minzoom: 14
        maxzoom: 22
        id_column: id

      osm_edges:
        schema: public
        geometry_column: geom
        minzoom: 13
        maxzoom: 22
        id_column: id

      # Metro lines
      metro_line_M1:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      metro_line_M2:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      metro_line_M3:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      metro_line_M4:
        schema: public
        geometry_column: geometry
        minzoom: 0
        maxzoom: 22
        id_column: id

      # Heatmaps & grids
      population_grid:
        schema: public
        geometry_column: geometry
        minzoom: 8
        maxzoom: 22
        id_column: id

      barbershop_density:
        schema: public
        geometry_column: geometry
        minzoom: 8
        maxzoom: 22
        id_column: id

      opportunity_heatmap:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      food_desert_h3:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      grocery_desert_h3:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      # Real estate
      retail_listings:
        schema: public
        geometry_column: location
        minzoom: 12
        maxzoom: 22
        id_column: id

      adres_locations:
        schema: public
        geometry_column: location
        minzoom: 12
        maxzoom: 22
        id_column: id

      # Zoning params (raw table, not view)
      sofiaplan_zoning_params:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

    # =========================================================
    # SofiaPlan tile views — zoning, demographics, economy
    # =========================================================
      sofiaplan_zoning_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_income_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_business_turnover_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_property_prices_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_neighborhoods_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_metro_catchments_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_population_grid_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_development_potential_tiles:
        schema: public
        geometry_column: geom
        minzoom: 10
        maxzoom: 22
        id_column: id

      sofiaplan_census_addresses_tiles:
        schema: public
        geometry_column: geom
        minzoom: 14
        maxzoom: 22
        id_column: id

      sofiaplan_demographic_forecast_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_demographic_forecast_ge_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_population_potential_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_residential_load_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

    # =========================================================
    # Transport & accessibility
    # =========================================================
      sofiaplan_transit_access_ge_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_transit_access_district_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_metro_access_800m_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
        maxzoom: 22
        id_column: id

      sofiaplan_metro_access_1200m_tiles:
        schema: public
        geometry_column: geom
        minzoom: 8
