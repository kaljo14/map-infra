apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
binaryData: {}
data:
  raspberry-pi-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "CPU Usage %",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              },
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "thresholdsStyle": { "mode": "line" }
              }
            }
          },
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU %"
            }
          ]
        },
        {
          "title": "Memory Usage %",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "thresholdsStyle": { "mode": "line" }
              }
            }
          },
          "targets": [
            {
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "Memory %"
            }
          ]
        },
        {
          "title": "CPU",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU"
            }
          ]
        },
        {
          "title": "Memory",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "Memory"
            }
          ]
        },
        {
          "title": "Disk",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"} * 100)",
              "legendFormat": "Disk"
            }
          ]
        },
        {
          "title": "Uptime",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": { "defaults": { "unit": "dtdurations" } },
          "targets": [
            {
              "expr": "time() - node_boot_time_seconds",
              "legendFormat": "Uptime"
            }
          ]
        },
        {
          "title": "Total Memory",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes",
              "legendFormat": "Total"
            }
          ]
        },
        {
          "title": "Disk Available",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "node_filesystem_avail_bytes{mountpoint=\"/\"}",
              "legendFormat": "Available"
            }
          ]
        },
        {
          "title": "Network I/O",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "fillOpacity": 15, "lineWidth": 2 }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Transmit" },
                "properties": [{ "id": "custom.transform", "value": "negative-Y" }]
              }
            ]
          },
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m])",
              "legendFormat": "Receive"
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m])",
              "legendFormat": "Transmit"
            }
          ]
        },
        {
          "title": "Disk I/O",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "fillOpacity": 15, "lineWidth": 2 }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Write" },
                "properties": [{ "id": "custom.transform", "value": "negative-Y" }]
              }
            ]
          },
          "targets": [
            {
              "expr": "rate(node_disk_read_bytes_total[5m])",
              "legendFormat": "Read"
            },
            {
              "expr": "rate(node_disk_written_bytes_total[5m])",
              "legendFormat": "Write"
            }
          ]
        },
        {
          "title": "CPU by Pod (Top 10)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "fillOpacity": 10, "lineWidth": 1, "stacking": { "mode": "normal" } }
            }
          },
          "targets": [
            {
              "expr": "topk(10, sum by (pod) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m])))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Memory by Pod (Top 10)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "fillOpacity": 10, "lineWidth": 1, "stacking": { "mode": "normal" } }
            }
          },
          "targets": [
            {
              "expr": "topk(10, sum by (pod) (container_memory_usage_bytes{container!=\"\",container!=\"POD\"}))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Pod Restarts (24h)",
          "type": "table",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 29 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "custom": { "displayMode": "color-background" }
            }
          },
          "targets": [
            {
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[24h])) > 0",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "namespace": "Namespace", "pod": "Pod", "Value": "Restarts (24h)" } } }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["raspberry-pi", "infrastructure"],
      "templating": { "list": [] },
      "time": { "from": "now-3h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Raspberry Pi Overview",
      "uid": "rpi-overview"
    }
  envoy-access-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Total Requests / sec",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 20, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"lonctus\"} [1m])) / 60",
              "legendFormat": "req/s"
            }
          ]
        },
        {
          "title": "Error Rate (4xx + 5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 20, "lineWidth": 2 },
              "color": { "mode": "fixed", "fixedColor": "red" }
            }
          },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"lonctus\", response_code=~\"[45]..\"} [1m]))",
              "legendFormat": "errors/min"
            }
          ]
        },
        {
          "title": "Requests by Service",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [
            {
              "expr": "sum by (app) (count_over_time({namespace=\"lonctus\"} [$__range]))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "title": "Requests by Status Code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 15, "lineWidth": 2, "stacking": { "mode": "normal" } }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "2.." },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "3.." },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "4.." },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "5.." },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              }
            ]
          },
          "targets": [
            {
              "expr": "sum by (response_code) (count_over_time({namespace=\"lonctus\"} [1m]))",
              "legendFormat": "{{response_code}}"
            }
          ]
        },
        {
          "title": "Requests by HTTP Method",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              }
            }
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "sum by (method) (count_over_time({namespace=\"lonctus\"} [$__range]))",
              "legendFormat": "{{method}}"
            }
          ]
        },
        {
          "title": "5xx Errors by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 20, "lineWidth": 2 },
              "color": { "mode": "palette-classic" }
            }
          },
          "targets": [
            {
              "expr": "sum by (app) (count_over_time({namespace=\"lonctus\", response_code=~\"5..\"} [1m]))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "title": "4xx Errors by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 20, "lineWidth": 2 },
              "color": { "mode": "palette-classic" }
            }
          },
          "targets": [
            {
              "expr": "sum by (app) (count_over_time({namespace=\"lonctus\", response_code=~\"4..\"} [1m]))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "title": "Places API — Status Codes",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 24 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 15, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "expr": "sum by (response_code) (count_over_time({app=\"places-scraper\"} [1m]))",
              "legendFormat": "{{response_code}}"
            }
          ]
        },
        {
          "title": "Tileserver — Status Codes",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 24 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 15, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "expr": "sum by (response_code) (count_over_time({app=\"tileserver\"} [1m]))",
              "legendFormat": "{{response_code}}"
            }
          ]
        },
        {
          "title": "Martin — Status Codes",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 24 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 15, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "expr": "sum by (response_code) (count_over_time({app=\"martin\"} [1m]))",
              "legendFormat": "{{response_code}}"
            }
          ]
        },
        {
          "title": "Top Users by Request Count",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "datasource": { "type": "loki", "uid": "" },
          "targets": [
            {
              "expr": "topk(10, sum by (user) (count_over_time({namespace=\"lonctus\", user!=\"\"} [$__range])))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "user": "User", "Value": "Requests" } } }
          ]
        },
        {
          "title": "Live Error Logs",
          "type": "logs",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 32 },
          "datasource": { "type": "loki", "uid": "" },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "expr": "{namespace=\"lonctus\", response_code=~\"[45]..\"}"
            }
          ]
        },
        {
          "title": "Log Volume by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 42 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 30, "lineWidth": 1, "stacking": { "mode": "normal" } }
            }
          },
          "targets": [
            {
              "expr": "sum by (app) (count_over_time({namespace=\"lonctus\"} [1m]))",
              "legendFormat": "{{app}}"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["envoy", "loki", "access-logs"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Envoy Access Logs",
      "uid": "envoy-access-logs"
    }
  request-latency.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 2,
      "links": [],
      "panels": [
        {
          "title": "Overall Latency Percentiles (all services)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "fillOpacity": 10, "lineWidth": 2 }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "p99" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              },
              {
                "matcher": { "id": "byName", "options": "p90" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }]
              },
              {
                "matcher": { "id": "byName", "options": "p75" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }]
              },
              {
                "matcher": { "id": "byName", "options": "p50" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }]
              }
            ]
          },
          "targets": [
            {
              "expr": "quantile_over_time(0.99, {namespace=\"lonctus\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "expr": "quantile_over_time(0.90, {namespace=\"lonctus\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p90",
              "refId": "B"
            },
            {
              "expr": "quantile_over_time(0.75, {namespace=\"lonctus\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p75",
              "refId": "C"
            },
            {
              "expr": "quantile_over_time(0.50, {namespace=\"lonctus\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p50",
              "refId": "D"
            }
          ]
        },
        {
          "title": "Places API — Latency Percentiles",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "fillOpacity": 10, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "expr": "quantile_over_time(0.99, {app=\"places-scraper\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "expr": "quantile_over_time(0.90, {app=\"places-scraper\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p90",
              "refId": "B"
            },
            {
              "expr": "quantile_over_time(0.50, {app=\"places-scraper\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p50",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Tileserver — Latency Percentiles",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "datasource": { "type": "loki", "uid": "" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "fillOpacity": 10, "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "expr": "quantile_over_time(0.99, {app=\"tileserver\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "expr": "quantile_over_time(0.90, {app=\"tileserver\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p90",
              "refId": "B"
            },
            {
              "expr": "quantile_over_time(0.50, {app=\"tileserver\"} | json | unwrap duration [5m]) by ()",
              "legendFormat": "p50",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Martin — Latency Percentiles",
          "type": "timeseries",
