apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      # Public HTTPS endpoints — expect 2xx and valid TLS cert
      http_2xx_ssl:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200, 201, 204, 301, 302]
          method: GET
          fail_if_not_ssl: true
          tls_config:
            insecure_skip_verify: false
          preferred_ip_protocol: ip4

      # Protected endpoints — 401/403 is expected (auth required), but not 5xx
      http_4xx_ok:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200, 201, 204, 301, 302, 400, 401, 403]
          method: GET
          fail_if_not_ssl: true
          preferred_ip_protocol: ip4

      # TCP connectivity check
      tcp_connect:
        prober: tcp
        timeout: 5s
